<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">One cycle, every 90 seconds</text>
  <text x="40" y="74" font-size="15" fill="#64748b">Outbound HTTPS only. Every step is a SQLite transaction, so a crash at any point resumes without double sends.</text>

  <g font-size="15">
    <g transform="translate(40,110)">
      <rect width="170" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="16" y="34" font-size="28">💬</text>
      <text x="16" y="66" font-weight="700" fill="#0f172a">Read comments</text>
      <text x="16" y="88" fill="#64748b">each active reel,</text>
      <text x="16" y="106" fill="#64748b">7-day backlog too</text>
    </g>
    <line x1="214" y1="170" x2="238" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(242,110)">
      <rect width="170" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="16" y="34" font-size="28">🔤</text>
      <text x="16" y="66" font-weight="700" fill="#0f172a">Match keyword</text>
      <text x="16" y="88" fill="#64748b">Cyrillic ⇄ Latin,</text>
      <text x="16" y="106" fill="#64748b">case, ё/е, typos</text>
    </g>
    <line x1="416" y1="170" x2="440" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(444,110)">
      <rect width="170" height="120" rx="14" fill="#fdf2f8" stroke="#dd2a7b"/>
      <text x="16" y="34" font-size="28">🔒</text>
      <text x="16" y="66" font-weight="700" fill="#0f172a">Claim once</text>
      <text x="16" y="88" fill="#64748b">recorded before</text>
      <text x="16" y="106" fill="#64748b">the request leaves</text>
    </g>
    <line x1="618" y1="170" x2="642" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(646,110)">
      <rect width="170" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="16" y="34" font-size="28">📩</text>
      <text x="16" y="66" font-weight="700" fill="#0f172a">Private reply</text>
      <text x="16" y="88" fill="#64748b">DM with the link,</text>
      <text x="16" y="106" fill="#64748b">rate-limited per hour</text>
    </g>
    <line x1="820" y1="170" x2="844" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(848,110)">
      <rect width="150" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="16" y="34" font-size="28">💭</text>
      <text x="16" y="66" font-weight="700" fill="#0f172a">Public reply</text>
      <text x="16" y="88" fill="#64748b">"check your DMs",</text>
      <text x="16" y="106" fill="#64748b">rotating texts</text>
    </g>
    <line x1="1002" y1="170" x2="1026" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
    <g transform="translate(1030,110)">
      <rect width="130" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="16" y="34" font-size="28">🔔</text>
      <text x="16" y="66" font-weight="700" fill="#0f172a">Report</text>
      <text x="16" y="88" fill="#64748b">journal +</text>
      <text x="16" y="106" fill="#64748b">Telegram alerts</text>
    </g>
  </g>
  <text x="40" y="270" font-size="14" fill="#64748b">An unclear answer from Meta is never retried blindly: the person is marked "uncertain" and you are told, instead of risking a second DM.</text>
</svg>
