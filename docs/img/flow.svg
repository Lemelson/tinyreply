<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dd2a7b"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="559" rx="22" fill="#ffffff" stroke="#e2e8f0"/><text x="44" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#0f172a" font-weight="800" text-anchor="start" >One cycle, every 90 seconds</text><text x="44" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#475569" font-weight="400" text-anchor="start" >Outbound HTTPS only. Each step is committed to SQLite before the next one starts.</text><line x1="154" y1="196" x2="258" y2="196" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="110" cy="196" r="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/><g transform="translate(95,181) scale(1.2500)" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></g><circle cx="140" cy="166" r="13" fill="#0f172a"/><text x="140" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" >1</text><text x="110" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle" >Read</text><text x="110" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >comments of every</text><text x="110" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >active reel (7 days)</text><line x1="350" y1="196" x2="454" y2="196" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="306" cy="196" r="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/><g transform="translate(291,181) scale(1.2500)" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 16 6-12 6 12" /><path d="M8 12h8" /><path d="m16 20 2 2 4-4" /></g><circle cx="336" cy="166" r="13" fill="#0f172a"/><text x="336" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" >2</text><text x="306" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle" >Match</text><text x="306" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >keyword rules,</text><text x="306" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >questions skipped</text><line x1="546" y1="196" x2="650" y2="196" stroke="#dd2a7b" stroke-width="2.5" marker-end="url(#ahp)"/><circle cx="502" cy="196" r="40" fill="#fdf2f8" stroke="#dd2a7b" stroke-width="2.5"/><g transform="translate(487,181) scale(1.2500)" fill="none" stroke="#dd2a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></g><circle cx="532" cy="166" r="13" fill="#0f172a"/><text x="532" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" >3</text><text x="502" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle" >Claim</text><text x="502" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >written to the DB</text><text x="502" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >before the request</text><line x1="742" y1="196" x2="846" y2="196" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="698" cy="196" r="40" fill="#fdf2f8" stroke="#dd2a7b" stroke-width="2.5"/><g transform="translate(683,181) scale(1.2500)" fill="none" stroke="#dd2a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></g><circle cx="728" cy="166" r="13" fill="#0f172a"/><text x="728" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" >4</text><text x="698" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle" >Private reply</text><text x="698" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >the DM with your link,</text><text x="698" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >≤ N per hour, spaced</text><line x1="938" y1="196" x2="1042" y2="196" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="894" cy="196" r="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/><g transform="translate(879,181) scale(1.2500)" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7" /><path d="M20 18v-2a4 4 0 0 0-4-4H4" /></g><circle cx="924" cy="166" r="13" fill="#0f172a"/><text x="924" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" >5</text><text x="894" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle" >Public reply</text><text x="894" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >“check your DMs”</text><text x="894" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >under the comment</text><circle cx="1090" cy="196" r="40" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/><g transform="translate(1075,181) scale(1.2500)" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></g><circle cx="1120" cy="166" r="13" fill="#0f172a"/><text x="1120" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle" >6</text><text x="1090" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700" text-anchor="middle" >Report</text><text x="1090" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >journal, statistics,</text><text x="1090" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="middle" >Telegram alerts</text><path d="M698,336 L698,364" stroke="#94a3b8" stroke-width="2"/><path d="M398,364 L998,364" stroke="#94a3b8" stroke-width="2"/><line x1="398" y1="364" x2="398" y2="392" stroke="#16a34a" stroke-width="2" marker-end="url(#ahg)"/><rect x="263" y="396" width="270" height="104" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><g transform="translate(281,412) scale(0.9167)" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5" /></g><text x="312" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start" >Meta confirms</text><text x="281" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="start" >Marked done. Next person.</text><line x1="698" y1="364" x2="698" y2="392" stroke="#d97706" stroke-width="2" marker-end="url(#ah)"/><rect x="563" y="396" width="270" height="104" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><g transform="translate(581,412) scale(0.9167)" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></g><text x="612" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start" >Never left the machine</text><text x="581" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="start" >Back in the queue,</text><text x="581" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="start" >tried next cycle.</text><line x1="998" y1="364" x2="998" y2="392" stroke="#dc2626" stroke-width="2" marker-end="url(#ahr)"/><rect x="863" y="396" width="270" height="104" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><g transform="translate(881,412) scale(0.9167)" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></g><text x="912" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start" >Unclear answer</text><text x="881" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="start" >Marked uncertain, never sent</text><text x="881" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#475569" font-weight="400" text-anchor="start" >again; pause + alert.</text><text x="44" y="534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8" font-weight="400" text-anchor="start" >Rule of thumb: a missed DM can be fixed by hand, a second DM cannot be taken back.</text></svg>
