name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: autoreply
        run: python -B -m unittest discover -s tests -t .
      - name: Simulator tests
        working-directory: autoreply
        run: python -B -m unittest discover -s sim -t .
      - name: Named end-to-end scenarios
        working-directory: autoreply
        run: python -B sim/soak.py --only named
  leak-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
