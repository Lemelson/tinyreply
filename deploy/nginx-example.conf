# Example nginx site for the optional web process (autoreply/web.py, SPEC section 14.1).
# Replace bot.example.com with your own domain, get a certificate first, for example:
#   certbot certonly --webroot -w /var/www/acme -d bot.example.com
# Then copy to /etc/nginx/conf.d/tinyreply.conf, `nginx -t` and `systemctl reload nginx`.
#
# Everything is proxied to web.py on 127.0.0.1:5421 (deploy/ig-autoreply-web.service):
#   /meta/webhook   Meta's webhook (button taps), signature-checked by web.py
#   /r/<token>      tracked links: counts the click, redirects to your link
#   /panel/         the web panel behind a login (PANEL_USER / PANEL_PASSWORD in state/.env)
limit_req_zone $binary_remote_addr zone=tinyreply_panel:1m rate=30r/m;   # slows password guessing

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bot.example.com;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location = / { return 302 /panel/; }
    location = /meta/webhook {
        limit_except GET POST { deny all; }
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:5421;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }
    location ^~ /r/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5421;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_read_timeout 15s;
    }
    location ^~ /panel {
        limit_except GET POST { deny all; }
        client_max_body_size 4k;
        limit_req zone=tinyreply_panel burst=60 nodelay;
        limit_req_status 429;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:5421;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
